<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>King — Keys</title>
  <link rel="stylesheet" href="/admin/assets/style.css">
  <script src="/admin/assets/app.js" defer></script>
</head>
<body>
  <section id="login-view" class="login-view" hidden>
    <form id="login-form" class="login-card">
      <div class="mark" aria-hidden="true">K</div>
      <p class="eyebrow">KING / KINOUE</p>
      <h1>Sign in</h1>
      <label for="password">Admin password</label>
      <input id="password" type="password" autocomplete="current-password" required maxlength="256" autofocus>
      <p id="login-error" class="error" role="alert"></p>
      <button class="primary" type="submit">Sign in <span aria-hidden="true">↗</span></button>
    </form>
  </section>

  <div id="dashboard" hidden>
    <header class="topbar">
      <a class="brand" href="/admin/" aria-label="King keys"><span class="mark small" aria-hidden="true">K</span><strong>KING</strong><span class="divider">/</span><span class="muted">Key management</span></a>
      <button id="logout" class="quiet">Sign out <span aria-hidden="true">↗</span></button>
    </header>
    <main class="workspace">
      <div class="heading">
        <div><p class="eyebrow">KINOUE / ACCESS CONTROL</p><h1>Keys<span class="title-dot">.</span></h1></div>
        <div class="button-row"><button id="open-scripts" class="secondary">Scripts</button><button id="open-create" class="primary"><span aria-hidden="true">+</span> New key</button></div>
      </div>
      <section class="key-panel" aria-label="License keys">
        <div class="toolbar">
          <div class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search keys" aria-label="Search keys" maxlength="120"></div>
          <div class="filters"><select id="app-filter" aria-label="Filter by script"><option value="">All scripts</option></select><select id="status-filter" aria-label="Filter by status"><option value="">All statuses</option><option value="active">Active</option><option value="expired">Expired</option><option value="revoked">Revoked</option></select></div>
        </div>
        <div class="table-wrap"><table><thead><tr><th>Key</th><th>Script</th><th>Status</th><th>HWID</th><th>Expires</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody id="key-rows"></tbody></table></div>
        <div id="empty" class="empty" hidden><span class="empty-icon" aria-hidden="true">⌁</span><h2>No keys yet</h2><p class="muted">Create a key to grant access.</p></div>
        <footer class="table-footer"><span id="result-count" class="muted" aria-live="polite">Loading…</span><div class="pagination"><button id="previous" class="quiet" aria-label="Previous page">←</button><span id="page-number">01</span><button id="next" class="quiet" aria-label="Next page">→</button></div></footer>
      </section>
      <footer class="workspace-footer"><span>KING <span class="muted">/ KINOUE</span></span><span class="muted">Key service</span></footer>
    </main>
  </div>

  <dialog id="create-dialog">
    <form id="create-form">
      <div class="dialog-heading"><div><p class="eyebrow">ACCESS</p><h2>New key</h2></div><button type="button" class="close quiet" aria-label="Close">×</button></div>
      <label for="create-application">Script</label><select id="create-application" required></select>
      <label for="create-label">Label</label><input id="create-label" placeholder="Player or order" maxlength="120">
      <label for="create-days">Duration (days)</label><input id="create-days" type="number" min="1" max="3650" value="30" required>
      <div class="dialog-footer"><button class="primary" type="submit">Create key <span aria-hidden="true">↗</span></button></div>
    </form>
  </dialog>

  <dialog id="created-dialog">
    <div class="dialog-heading"><div><p class="eyebrow">CREATED</p><h2>Your new key</h2></div><button type="button" class="close quiet" aria-label="Close">×</button></div>
    <label for="new-key">Shown once</label><div class="input-action"><input id="new-key" class="mono" readonly><button id="copy-key" class="secondary" type="button">Copy</button></div>
    <div class="dialog-footer"><button class="primary close" type="button">Done</button></div>
  </dialog>

  <dialog id="detail-dialog" class="wide-dialog">
    <div class="dialog-heading"><div><p id="detail-script" class="eyebrow"></p><h2 id="detail-title">Key</h2></div><button type="button" class="close quiet" aria-label="Close">×</button></div>
    <div class="detail-meta"><span id="detail-status" class="badge"></span><span id="detail-expiry" class="muted"></span></div>
    <label for="bound-hwid">Bound HWID</label><textarea id="bound-hwid" class="mono" rows="2" readonly></textarea>
    <div class="button-row small-gap"><button id="copy-hwid" class="secondary" type="button">Copy HWID</button><button id="reset-hwid" class="secondary" type="button">Reset HWID lock</button></div>
    <form id="hwid-form" class="stack-block"><label for="replacement-hwid">Replace HWID</label><div class="input-action"><input id="replacement-hwid" class="mono" maxlength="512" required autocomplete="off"><button class="secondary" type="submit">Save</button></div></form>
    <form id="renew-form" class="stack-block"><label for="renew-days">Renew from today (days)</label><div class="input-action"><input id="renew-days" type="number" min="1" max="3650" value="30" required><button class="secondary" type="submit">Renew</button></div></form>
    <details class="activity"><summary>Activity</summary><ol id="activity-list"></ol></details>
    <div class="dialog-footer split"><button id="delete-key" class="danger" type="button">Delete key</button><button id="revoke-key" class="secondary" type="button">Revoke key</button></div>
  </dialog>

  <dialog id="scripts-dialog" class="wide-dialog">
    <div class="dialog-heading"><div><p class="eyebrow">PAYLOADS</p><h2>Scripts</h2></div><button type="button" class="close quiet" aria-label="Close">×</button></div>
    <div id="script-list" class="script-list"></div>
    <form id="script-form" class="stack-block">
      <div class="section-heading"><h3 id="script-form-title">Add script</h3><button id="cancel-script-edit" type="button" class="quiet" hidden>Cancel edit</button></div>
      <div class="two-fields"><div><label for="script-name">Name</label><input id="script-name" maxlength="80" required></div><div><label for="script-id">Application ID</label><input id="script-id" pattern="[a-z][a-z0-9_-]{0,63}" maxlength="64" placeholder="king" required></div></div>
      <label for="script-file">Luau file</label><input id="script-file" type="file" accept=".lua,.luau,.txt" required>
      <div class="dialog-footer"><button class="primary" type="submit">Save script <span aria-hidden="true">↗</span></button></div>
    </form>
  </dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
