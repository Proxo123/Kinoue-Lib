name: Build and test
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/security_check.py
      - run: bash tools/ci_security.sh
  admin-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run build
      - name: Check committed admin assets
        run: git diff --exit-code -- ../key_service/web
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get official Luau tools
        run: |
          mkdir -p .cache/luau
          curl --fail --location --silent --show-error https://github.com/luau-lang/luau/releases/download/0.742/luau-ubuntu.zip -o .cache/luau.zip
          unzip -q .cache/luau.zip -d .cache/luau
          chmod +x .cache/luau/luau .cache/luau/luau-compile
      - name: Get StyLua
        run: |
          curl --fail --location --silent --show-error https://github.com/JohnnyMorganz/StyLua/releases/download/v2.0.2/stylua-linux-x86_64.zip -o .cache/stylua.zip
          unzip -q .cache/stylua.zip -d .cache
          chmod +x .cache/stylua
      - name: Check formatting
        run: .cache/stylua --check src tests examples loader.luau
      - name: Compile and check behavior
        run: python3 tools/test.py --luau .cache/luau/luau --compiler .cache/luau/luau-compile
      - name: Install key service test dependencies
        run: python3 -m pip install -r backend/requirements-dev.txt
      - name: Check key service
        run: python3 -m pytest -q backend/tests
      - name: Check reproducible build
        run: git diff --exit-code -- dist
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kinoue
          POSTGRES_PASSWORD: integration-test-password
          POSTGRES_DB: kinoue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kinoue -d kinoue_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KINOUE_TEST_DATABASE_URL: postgresql://kinoue:integration-test-password@localhost:5432/kinoue_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q backend/tests
